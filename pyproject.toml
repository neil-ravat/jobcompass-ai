[project]
name = "jobcompass"
version = "0.1.0"
description = "A learner-built backend using real job listings."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pycountry>=24.6",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
